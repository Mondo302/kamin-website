<!--
  Root of kamin-dashboard (2026-09-26). Supabase's email links fall back to
  the project's Site URL, which is this bare root; there was no page here,
  so confirmation links 404'd. Auth links (a hash or query carrying
  access_token, type=, token_hash, code= or error) forward to the login page
  keeping the query and hash, which supabase-js on login.html turns into a
  session; password-recovery links go to reset-password.html.
  Everyone else (2026-09-28, client approved the site) goes to the marketing
  site. The query goes along too (2026-11-23): the forms link to
  /?lang=<en|ar>#privacy, and the site reads ?lang. This is a client-side redirect, not a vercel.json rewrite: a rewrite
  can't see the #hash, and the site's relative refs (support.js,
  image-slot.js, kamin-map.html, assets/team-*.png) only resolve under
  /website/.
-->
<script>
  (function () {
    var hash = location.hash || '';
    var auth = /(^|[#?&])(access_token|refresh_token|type|token_hash|code|error|error_code|error_description)=/;
    if (!auth.test(hash) && !auth.test(location.search || '')) {
      location.replace('/website/kamin-website.dc.html' + (location.search || '') + hash);
      return;
    }
    // type=recovery can arrive in the hash (implicit flow) or the query
    // (token_hash template); either way it must reach the reset page.
    var recovery = /(^|[#?&])type=recovery(&|$)/;
    var page = recovery.test(hash) || recovery.test(location.search || '') ? 'reset-password.html' : 'login.html';
    location.replace('/dashboard/' + page + location.search + hash);
  })();
</script>
