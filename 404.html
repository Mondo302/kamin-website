<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة | Page not found | Kamin</title>
<meta name="robots" content="noindex">
<!--
  Vercel serves this file, with status 404, for any path the deploy doesn't
  have (2026-10-02). It is served at the unknown URL itself (/forms/nope,
  /a/b/c), so every link and asset below is root-relative ("/assets/..."):
  a relative path would break one folder down. deploy-check.mjs enforces it.
  Look and tokens are the public forms' (navy bar, cream page, gold accent).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B24; --navy-1:#1B2530; --gold:#C6A15E; --gold-5:#8B6B3E;
    --cream:#FCFAF6; --gray-6:#5F6870;
    --font-ar-display:'Amiri', serif; --font-ar-body:'IBM Plex Sans Arabic', sans-serif;
    --font-en-display:'Cormorant Garamond', serif; --font-en-body:'Jost', sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--cream); color:var(--navy); font-family:var(--font-ar-body); line-height:1.7; position:relative; }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(680px 420px at 14% -8%, rgba(198,161,94,.16), transparent 60%),
      radial-gradient(520px 360px at 100% 10%, rgba(198,161,94,.09), transparent 65%),
      var(--cream);
  }
  html[lang="en"] body{ font-family:var(--font-en-body); }
  h1{ font-family:var(--font-ar-display); font-weight:700; font-size:32px; margin:0 0 14px; }
  html[lang="en"] h1{ font-family:var(--font-en-display); font-weight:600; font-size:36px; }

  .nav{ position:sticky; top:0; z-index:50; background:rgba(16,27,36,.9); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(198,161,94,.22); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
  .langbtn{ background:transparent; border:1px solid #DCC08A; color:#E3C88A; border-radius:20px; padding:6px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
  .langbtn:hover{ background:rgba(198,161,94,.12); }

  .wrap{ max-width:560px; margin:0 auto; padding:96px 20px 100px; text-align:center; }
  .kicker{ color:var(--gold-5); font-size:13px; letter-spacing:.06em; margin:0 0 10px; }
  .lede{ color:var(--gray-6); font-size:16px; margin:0 0 32px; }
  a.btn{ display:inline-block; font-size:15px; font-weight:600; border-radius:8px; padding:14px 30px; text-decoration:none; background:var(--navy); color:var(--cream); min-height:48px; }
  a.btn:hover{ background:#1E2E3A; }
  a.btn:focus-visible, .langbtn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  [data-en]{ display:none; }
  html[lang="en"] [data-ar]{ display:none; }
  html[lang="en"] [data-en]{ display:inline; }
  html[lang="en"] h1[data-en], html[lang="en"] p[data-en]{ display:block; }

  @media (max-width:600px){
    .nav{ padding:14px 16px; }
    .wrap{ padding:64px 16px 80px; }
    a.btn{ display:block; }
  }
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#101B24">
</head>
<body>

<nav class="nav">
  <a href="/" style="display:inline-flex; text-decoration:none;"><img src="/assets/kamin-logo-mark.png" alt="Kamin" style="height:24px; width:auto; display:block;"></a>
  <button class="langbtn" id="langToggle" type="button" onclick="toggleLang()">English</button>
</nav>

<main class="wrap">
  <p class="kicker">404</p>
  <h1 data-ar>هذه الصفحة غير موجودة</h1>
  <h1 data-en>This page doesn't exist</h1>
  <p class="lede" data-ar>ربما تغيّر الرابط أو كُتب بشكل غير صحيح.</p>
  <p class="lede" data-en>The link may have changed, or it was typed incorrectly.</p>
  <a class="btn" href="/"><span data-ar>العودة إلى الصفحة الرئيسية</span><span data-en>Back to the home page</span></a>
</main>

<script src="/assets/kamin-lang.js"></script>
<script>
  function applyLang(lang){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('langToggle').textContent = lang === 'ar' ? 'English' : 'العربية';
  }
  function toggleLang(){ applyLang(document.documentElement.lang === 'ar' ? 'en' : 'ar'); kaminRememberLang(document.documentElement.lang); }
  applyLang(kaminStartLang('ar'));
</script>
</body>
</html>
